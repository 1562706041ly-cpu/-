<text x="90" y="966.1300000000001" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">第四章</text>
<text x="90" y="999.94" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">比较方法</text>
<rect x="450" y="678" width="1920" height="54" rx="10" fill="#F9D0D0" stroke="#D75C5C" stroke-width="2.5"/>
<text x="1410" y="705.0" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">分流引导的可靠正负关系构建与对比学习（先判断关系是否可信，再拉近/推远）</text>
<rect x="170" y="880" width="250" height="200" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="295.0" y="919.28" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">输入</text>
<text x="295.0" y="953.0899999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">增强视图特征</text>
<text x="295.0" y="983.4499999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">z1, z2</text>
<text x="295.0" y="1013.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">K(x)、R(x)、分流结果</text>
<text x="295.0" y="1044.17" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">已知类标签</text>
<rect x="450" y="755" width="330" height="130" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="615.0" y="789.64" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">标签锚点</text>
<text x="615.0" y="823.4499999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">同一已知标签 → 可靠正关系</text>
<text x="615.0" y="853.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">不同已知标签 → 可靠负关系</text>
<rect x="450" y="905" width="330" height="170" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="615.0" y="929.28" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">分流/暂定类别 + 邻域</text>
<text x="615.0" y="963.0899999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">互为k近邻、共享邻居多</text>
<text x="615.0" y="993.4499999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">→ 正对候选</text>
<text x="615.0" y="1023.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">邻域无联系且暂定类别不同</text>
<text x="615.0" y="1054.17" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">→ 负对候选</text>
<rect x="450" y="1095" width="330" height="130" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="615.0" y="1129.64" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">跨视图一致性</text>
<text x="615.0" y="1163.45" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">弱视图与自适应视图</text>
<text x="615.0" y="1193.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">关系是否一致</text>
<rect x="840" y="870" width="340" height="245" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="1010.0" y="946.96" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">关系可信度评估</text>
<text x="1010.0" y="980.77" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">综合锚点、邻域、</text>
<text x="1010.0" y="1011.13" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">跨视图一致性与分流权重</text>
<text x="1010.0" y="1041.49" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">判断正/负关系是否可信</text>
<rect x="1260" y="755" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="1410.0" y="810.0" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">可靠负对 → 推远</text>
<rect x="1260" y="895" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="1410.0" y="950.0" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">可靠正对 → 拉近</text>
<rect x="1260" y="1040" width="300" height="120" rx="14" fill="#F1F1F1" stroke="#8A8A8A" stroke-width="2.5" stroke-dasharray="10,7"/>
<text x="1410.0" y="1084.8200000000002" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">不确定关系</text>
<text x="1410.0" y="1118.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">降权或暂不使用</text>
<rect x="1640" y="755" width="320" height="150" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="1800.0" y="799.64" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">选择性难负样本</text>
<text x="1800.0" y="833.4499999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">可信负关系中混合合成</text>
<text x="1800.0" y="863.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">难度预算=f(可信度)</text>
<rect x="1640" y="965" width="320" height="200" rx="14" fill="#D8EDD1" stroke="#69AE5A" stroke-width="2.5"/>
<text x="1800.0" y="1019.46" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">联合优化（分阶段）</text>
<text x="1800.0" y="1053.2700000000002" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">已知类监督</text>
<text x="1800.0" y="1083.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">+ 同源视图对比</text>
<text x="1800.0" y="1113.99" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">+ 可靠关系加权对比</text>
<rect x="2040" y="800" width="290" height="325" rx="14" fill="#D5E6F8" stroke="#4A82C2" stroke-width="2.5"/>
<text x="2185.0" y="901.78" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">输出</text>
<text x="2185.0" y="935.5899999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">已知类：准确识别</text>
<text x="2185.0" y="965.9499999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">未知类：聚类发现</text>
<text x="2185.0" y="996.31" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">多个未知故障类别</text>
<text x="2185.0" y="1026.67" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">（而非单一“未知类”）</text>
