<text x="90" y="344.13" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">第三章</text>
<text x="90" y="377.94" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">增强方法</text>
<rect x="170" y="118" width="2200" height="54" rx="10" fill="#F9D0D0" stroke="#D75C5C" stroke-width="2.5"/>
<text x="1270" y="145.0" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">已知性与可靠度联合控制的自适应增强</text>
<rect x="170" y="280" width="250" height="170" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="295.0" y="319.46" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">输入</text>
<text x="295.0" y="353.27" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">少量标注样本</text>
<text x="295.0" y="383.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">+ 混合无标签</text>
<text x="295.0" y="413.99" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">样本 x</text>
<rect x="450" y="200" width="330" height="160" rx="14" fill="#FDE3C0" stroke="#EE9B3A" stroke-width="2.5"/>
<text x="615.0" y="249.64" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">已知性 K(x)</text>
<text x="615.0" y="283.45" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">能量与已知原型距离</text>
<text x="615.0" y="313.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">加权评价对已知的相似度</text>
<rect x="450" y="390" width="330" height="180" rx="14" fill="#FDE3C0" stroke="#EE9B3A" stroke-width="2.5"/>
<text x="615.0" y="434.46" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">可靠度 R(x)</text>
<text x="615.0" y="468.27" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">能量与原型证据一致性</text>
<text x="615.0" y="498.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">跨弱视图稳定性</text>
<text x="615.0" y="528.9899999999999" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">分流确定性</text>
<rect x="840" y="225" width="340" height="310" rx="14" fill="#FDE3C0" stroke="#EE9B3A" stroke-width="2.5"/>
<text x="1010.0" y="319.28" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">样本证据分区</text>
<text x="1010.0" y="353.09" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">高K·高R → 可靠已知</text>
<text x="1010.0" y="383.45" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">低K·高R → 可靠未知</text>
<text x="1010.0" y="413.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">证据冲突/低R → 不确定</text>
<text x="1010.0" y="444.17" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">（软权重，不做硬划分）</text>
<rect x="1240" y="225" width="340" height="310" rx="14" fill="#FDE3C0" stroke="#EE9B3A" stroke-width="2.5"/>
<text x="1410.0" y="319.28" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">增强预算分配 b(x)=f(K,R)</text>
<text x="1410.0" y="353.09" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">控制扰动强度与模态数</text>
<text x="1410.0" y="383.45" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">高K可靠 → 弱扰动</text>
<text x="1410.0" y="413.81" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">低K可靠 → 适度加强</text>
<text x="1410.0" y="444.17" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">不确定 → 保守</text>
<rect x="1640" y="200" width="320" height="140" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="1800.0" y="254.82" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">VMD 分解</text>
<text x="1800.0" y="288.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">得到各本征模态分量</text>
<rect x="1640" y="380" width="320" height="140" rx="14" fill="#FFFFFF" stroke="#777" stroke-width="2.5"/>
<text x="1800.0" y="434.82" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">按预算扰动模态幅值</text>
<text x="1800.0" y="468.63" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">重构得到增强视图</text>
<polygon points="2170,190.0 2330.0,310 2170,430.0 2010.0,310" fill="#FFFFFF" stroke="#555" stroke-width="2.5"/>
<text x="2170" y="285.16" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">保真检查</text>
<text x="2170" y="316.90000000000003" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">相对扰动量·频谱形状</text>
<text x="2170" y="341.74" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">·RMS相对变化</text>
<rect x="2010" y="500" width="320" height="95" rx="14" fill="#F4F4F4" stroke="#8A8A8A" stroke-width="2.5"/>
<text x="2170.0" y="532.32" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">未通过：预算缩减</text>
<text x="2170.0" y="566.13" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#222">仍不合格→保守视图回退</text>
